[package]
name = "keel-berth"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
description = "Give each parallel coding agent an isolated, ready workspace in a git repo"
license = "MIT"
repository = "https://github.com/keelstackhq/berth"
publish = false

[lib]
name = "berth"
path = "src/lib.rs"

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
toml = "=1.1.8"

[dev-dependencies]
assert_cmd = "=2.2.2"
insta = { version = "=1.49.0", features = ["json", "filters"] }
predicates = "=3.1.4"
tempfile = "=3.27.0"
