name: release

# berth releases through `hoist release` (hoist spec §9, §12; berth spec §16):
# - detect: is the version in Cargo.toml pending (no tag `v<version>`, or the tag is on HEAD)?
#   and is releasing switched on (repository variable BERTH_RELEASE = enabled)?
# - build: binaries for 5 targets. Runs when a release is pending AND enabled, or on a manual
#   run (workflow_dispatch = dry run: builds and smoke-tests, publishes nothing).
# - publish (pending AND enabled): tags, the GitHub Release, npm (launcher + platform packages)
#   and crates.io through trusted publishing, in environment `release`, with hoist from npm.
# - prepare (enabled): open, update or close the release PR (branch hoist/release).
#
# The gate: with BERTH_RELEASE unset a push to main runs `detect` only, so merging this file (or
# any commit) never tags, releases or publishes. See docs/releasing.md for the one-time setup.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.version.outputs.pending }}
      version: ${{ steps.version.outputs.version }}
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        # The same rule as `hoist release publish` (R19): pending when the manifest version has
        # no tag, or its tag points at HEAD (a re-run of this release).
        run: |
          version=$(awk -F'"' '/^\[/ { s = ($0 == "[package]") } s && /^version *=/ { print $2; exit }' Cargo.toml)
          tag="v$version"
          if sha=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            if [ "$sha" = "$(git rev-parse HEAD)" ]; then pending=true; else pending=false; fi
          else
            pending=true
          fi
          echo "version $version, tag $tag, pending $pending"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
      - id: gate
        env:
          BERTH_RELEASE: ${{ vars.BERTH_RELEASE }}
        run: |
          if [ "$BERTH_RELEASE" = "enabled" ]; then enabled=true; else enabled=false; fi
          echo "release gate (vars.BERTH_RELEASE): $enabled"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.detect.outputs.pending == 'true' && needs.detect.outputs.enabled == 'true')
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
            smoke: true
          # Built on an arm64 runner; not run here (checked with `file` instead).
          - target: x86_64-apple-darwin
            os: macos-latest
            smoke: false
          - target: aarch64-apple-darwin
            os: macos-latest
            smoke: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
      - name: Rename the binary to berth-<target>
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ext=""
          case "$TARGET" in *-windows-*) ext=".exe" ;; esac
          mkdir -p out
          cp "target/$TARGET/release/berth$ext" "out/berth-$TARGET$ext"
      - name: Smoke test (berth --version)
        if: matrix.smoke
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          ext=""
          case "$TARGET" in *-windows-*) ext=".exe" ;; esac
          got=$("out/berth-$TARGET$ext" --version)
          echo "$got"
          test "$got" = "berth $VERSION"
      - name: The musl binary is static
        if: matrix.musl
        env:
          TARGET: ${{ matrix.target }}
        run: |
          file "out/berth-$TARGET"
          file "out/berth-$TARGET" | grep -E 'statically linked|static-pie linked'
      - name: The Intel macOS binary is x86_64
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          file out/berth-x86_64-apple-darwin
          file out/berth-x86_64-apple-darwin | grep 'x86_64'
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: berth-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [detect, build]
    if: needs.detect.outputs.pending == 'true' && needs.detect.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # `cargo publish` (run by hoist without GH_TOKEN, R27) builds the crate.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # npm >= 11.5.1 and Node >= 22.14.0 do the OIDC exchange for trusted publishing.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - run: npm install -g npm@12.2.0
      # hoist comes from npm, pinned exactly: nothing is compiled in or before the step that
      # holds GH_TOKEN. 0.2.0 waits up to 5 min for npm to show a publish (0.1.0 waited ~8 s).
      - run: npm install -g @keelstackhq/hoist@0.2.0
      # dist/ is in .gitignore, so it neither dirties the tree nor ends up in the crate.
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: berth-*
          path: dist
          merge-multiple: true
      - run: hoist release publish --assets dist
        env:
          GH_TOKEN: ${{ github.token }}

  prepare:
    needs: [detect, publish]
    if: ${{ !cancelled() && needs.detect.outputs.enabled == 'true' && (needs.detect.outputs.pending == 'false' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A PR pushed with the default GITHUB_TOKEN runs no checks; the optional secret
      # HOIST_RELEASE_TOKEN (Contents and Pull requests: write) makes the release PR run CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.HOIST_RELEASE_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # prepare runs `pnpm install --lockfile-only` when the npm launcher's version changes.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 12.14.0
      - run: npm install -g @keelstackhq/hoist@0.2.0
      - run: hoist release prepare
        env:
          GH_TOKEN: ${{ secrets.HOIST_RELEASE_TOKEN || github.token }}
