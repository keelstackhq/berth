name: ci

on:
  pull_request:
    # ci-minutes: allow paths macOS/Windows worktree and port handling must be checked before merge
    # ready_for_review: a draft fails fast below, so it needs a full run once it is ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  INSTA_UPDATE: "no"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # CI minutes: a draft PR fails here before any build. A step, not a job-level `if:`, so a
      # draft never leaves `ci` skipped and `ci-ok` green.
      - name: not a draft
        env:
          DRAFT: ${{ github.event.pull_request.draft || false }}
        shell: bash
        run: |
          if [ "$DRAFT" = true ]; then echo "::error::draft: CI not run, mark ready for review"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast
      - if: runner.os == 'Linux'
        run: node --test npm/berth/test/*.test.js

  ci-ok:
    needs: ci
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.ci.result }}" = "success"
